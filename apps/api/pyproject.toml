[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dawa-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "neo4j>=5.26,<7",
  "ortools>=9.11,<10",
  "pandas>=2.2,<3",
  "statsmodels>=0.14,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "hypothesis>=6.120,<7",
  "httpx>=0.28,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
  "schemathesis>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["dawa_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=dawa_api --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dawa_api"]
