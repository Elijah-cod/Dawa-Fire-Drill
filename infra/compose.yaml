services:
  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dawa
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dawa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawa"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"
