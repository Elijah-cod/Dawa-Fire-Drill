services:
  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dawa
      NEO4J_URI: bolt://neo4j:7687
      APP_ENV: ${APP_ENV:-local}
      DEMO_ROLE_SWITCHER: ${DEMO_ROLE_SWITCHER:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: ../apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dawa
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: ../apps/api
    command: ["python", "-m", "dawa_api.jobs.worker", "--country", "KE"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dawa
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  postgres:
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      POSTGRES_DB: dawa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dawa"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    # Named volume: local data survives container recreation. `down -v` deletes it on purpose.
    volumes:
      - postgres-data:/var/lib/postgresql/data
  neo4j:
    image: neo4j:5@sha256:249a1ec6e3c52d82101a5ed33d6ed2b5ed5b0017b21a28c0bfebc335e87fb177
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"
      - "7687:7687"

volumes:
  postgres-data:
